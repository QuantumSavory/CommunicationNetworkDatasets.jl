env:
  JULIA_NUM_THREADS: auto

secrets:
  - CODECOV_TOKEN

steps:
  - label: General tests
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-test#v1:
          test_args: "general"
      - JuliaCI/julia-coverage#v1: ~

  - label: JET tests
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-test#v1:
          test_args: "jet"
      - JuliaCI/julia-coverage#v1: ~

  - label: Tyler tests
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - QuantumSavory/julia-xvfb#v1: ~
      - JuliaCI/julia-test#v1:
          test_args: "tyler"
      - JuliaCI/julia-coverage#v1: ~

  - label: Documentation
    branches: "!dependabot/*"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - QuantumSavory/julia-xvfb#v1: ~
      - JuliaCI/julia-test#v1:
          project: docs
          run_tests: false
    secrets:
      DOCUMENTER_KEY: DOCUMENTER_KEY_CommunicationNetworkDatasets
    command: julia --project=docs docs/make.jl
